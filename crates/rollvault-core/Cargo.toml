[package]
name = "rollvault-core"
description = "RollVault DIT engine: single-read multi-destination copy, cold read-back verification, ASC MHL"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[lib]
name = "rollvault_core"

[[bin]]
name = "rollvault-cli"
path = "src/bin/rollvault-cli.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
filetime = "0.2.29"
hex = "0.4.3"
libc = "0.2.191"
md-5 = "0.11.0"
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh64", "xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"
